<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183b36">
  <meta name="robots" content="noindex">
  <title>Website giáo viên đã chuyển</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f7f4;color:#1f302d;font:16px/1.7 system-ui,sans-serif}main{width:min(100%,520px);padding:36px;border:1px solid #e6ece8;border-radius:20px;background:#fff}h1{margin:0 0 12px;font-size:25px;line-height:1.3}p{margin:0 0 24px;color:#72817c}a{display:inline-block;padding:12px 18px;border-radius:10px;background:#183b36;color:#fff;text-decoration:none;font-weight:700}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <h1>Website giáo viên đã chuyển</h1>
    <p id="teacherRedirectStatus" role="status">Website dành cho giáo viên có địa chỉ riêng, cùng kết nối dữ liệu với nhà trường.</p>
    <a id="teacherWebsiteLink" hidden>Mở website giáo viên →</a>
    <noscript><p>Vui lòng bật JavaScript hoặc liên hệ nhà trường để nhận địa chỉ website giáo viên mới.</p></noscript>
  </main>
  <script src="portal-config.js" defer></script>
  <script src="teacher-redirect.js" defer></script>
</body>
</html>
